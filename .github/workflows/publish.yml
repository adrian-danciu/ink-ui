name: Publish Ink UI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-ink-ui-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Use an npm CLI that supports trusted publishing
        run: npm install --global npm@^11.5.1

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Version packages with pending Changesets
        shell: bash
        run: |
          if compgen -G '.changeset/*.md' > /dev/null; then
            bun run version-packages
            bun install
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .changeset packages bun.lock
            git commit -m 'chore(release): version packages'
            git push origin HEAD:main
          fi

      - name: Build publishable packages
        run: bun run build

      - name: Publish versions absent from npm
        run: node scripts/publish-packages.mjs
